<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>BPOC 121 Midterm Study App</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f7; --surface: #ffffff; --surface-2: #edf4f3; --text: #152422;
      --muted: #60706d; --line: #d6e0de; --accent: #0f766e; --accent-2: #115e59;
      --accent-soft: #d9f3ef; --good: #177245; --good-soft: #e2f5e9; --bad: #b42318;
      --bad-soft: #fee9e7; --warn: #a15c00; --warn-soft: #fff0cf; --shadow: 0 12px 32px rgba(25,48,44,.08);
      --radius: 18px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1312; --surface: #121e1c; --surface-2: #192825; --text: #edf7f5;
      --muted: #a2b7b3; --line: #2b403c; --accent: #43c7b8; --accent-2: #72d9ce;
      --accent-soft: #173d38; --good: #61d28e; --good-soft: #173c29; --bad: #ff8178;
      --bad-soft: #4b211e; --warn: #ffc15a; --warn-soft: #4b3716; --shadow: 0 16px 36px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent); outline-offset: 2px; }
    .shell { width: min(1120px, 100%); margin: 0 auto; padding: 22px 18px calc(88px + env(safe-area-inset-bottom)); }
    .app-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .eyebrow { color: var(--accent); font-size: .76rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 4px 0 5px; font-size: clamp(1.7rem, 4vw, 2.5rem); letter-spacing: -.04em; line-height: 1.05; }
    .subtitle { color: var(--muted); margin: 0; max-width: 700px; line-height: 1.45; }
    .theme-btn { min-width: 46px; min-height: 46px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 0 15px; box-shadow: var(--shadow); }
    .main-tabs { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px; margin-bottom: 18px; position: sticky; top: 8px; z-index: 20; box-shadow: var(--shadow); }
    .tab-btn { border: 0; border-radius: 11px; background: transparent; color: var(--muted); min-height: 46px; font-weight: 800; padding: 9px 12px; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    [data-theme="dark"] .tab-btn.active { color: #08221f; }
    .panel { display: none; }
    .panel.active { display: block; animation: rise .2s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .section-head h2, .section-head h3 { margin: 0 0 4px; letter-spacing: -.025em; }
    .section-head p { color: var(--muted); margin: 0; line-height: 1.45; }
    .pill { display: inline-flex; align-items: center; min-height: 30px; border-radius: 999px; padding: 5px 10px; background: var(--accent-soft); color: var(--accent-2); font-size: .78rem; font-weight: 800; white-space: nowrap; }
    .subtabs { display: flex; gap: 8px; margin: 0 0 14px; }
    .subtab { border: 1px solid var(--line); background: var(--surface); color: var(--muted); min-height: 42px; border-radius: 999px; padding: 8px 15px; font-weight: 800; }
    .subtab.active { border-color: var(--accent); color: var(--accent-2); background: var(--accent-soft); }
    .toolbar { display: grid; grid-template-columns: minmax(220px,1.6fr) repeat(2,minmax(160px,.75fr)); gap: 10px; margin-bottom: 12px; }
    .control { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 10px 12px; }
    .results-line { color: var(--muted); font-size: .88rem; margin: 8px 2px 12px; }
    .study-list { display: grid; gap: 10px; }
    details.study-item { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; overflow: hidden; }
    details.study-item[open] { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: var(--shadow); }
    .study-item summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; min-height: 64px; padding: 13px 16px; cursor: pointer; }
    .study-item summary::-webkit-details-marker { display: none; }
    .item-num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); font-weight: 900; font-size: .82rem; }
    .item-title { font-weight: 800; line-height: 1.35; }
    .chevron { color: var(--muted); transition: transform .2s; }
    details[open] .chevron { transform: rotate(180deg); }
    .study-body { padding: 0 16px 17px 62px; color: var(--text); line-height: 1.62; }
    .study-body p { margin: 0 0 12px; }
    .focus-box { background: var(--surface-2); border-left: 4px solid var(--accent); padding: 11px 13px; border-radius: 0 10px 10px 0; color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tag { border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; color: var(--muted); font-size: .73rem; font-weight: 750; }
    .empty { text-align: center; padding: 42px 20px; color: var(--muted); }
    .performance-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .overview { display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 24px; margin-bottom: 14px; }
    .donut { width: 132px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) var(--score,0%), var(--surface-2) 0); position: relative; }
    .donut::after { content:""; position:absolute; inset:16px; border-radius:50%; background:var(--surface); }
    .donut strong { position: relative; z-index: 1; font-size: 1.55rem; }
    .overview-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
    .stat { background: var(--surface-2); border-radius: 12px; padding: 12px; }
    .stat strong { display: block; font-size: 1.2rem; }
    .stat span { color: var(--muted); font-size: .76rem; }
    .category-card { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 15px; }
    .category-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .category-top h3 { font-size: .95rem; margin: 0; line-height: 1.3; }
    .category-top strong { color: var(--accent-2); }
    .bar { height: 9px; background: var(--surface-2); border-radius: 999px; overflow:hidden; margin: 11px 0 8px; }
    .bar > span { display:block; height:100%; background:var(--accent); border-radius:inherit; }
    .category-meta { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:.78rem; }
    .btn { border: 0; border-radius: 12px; min-height: 44px; padding: 9px 15px; background: var(--accent); color: #fff; font-weight: 850; }
    [data-theme="dark"] .btn { color: #08221f; }
    .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
    .btn.danger { background: var(--bad); color: #fff; }
    .btn.small { min-height: 36px; padding: 6px 10px; border-radius: 9px; font-size: .78rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .start-card { max-width: 760px; margin: 0 auto; text-align: center; padding: 34px 24px; }
    .start-card h2 { margin: 0 0 8px; }
    .start-card p { color: var(--muted); line-height: 1.55; }
    .start-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:18px; }
    .question-wrap { max-width: 860px; margin: 0 auto; }
    .question-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .progress { height: 10px; background: var(--surface-2); border-radius:999px; overflow:hidden; margin: 8px 0 18px; }
    .progress > span { display:block; height:100%; background:var(--accent); transition:width .2s; }
    .question-code { color: var(--accent-2); font-weight:850; font-size:.84rem; }
    .question-text { font-size: clamp(1.08rem,2.5vw,1.35rem); line-height:1.5; margin:8px 0 18px; font-weight:800; }
    .choices { display:grid; gap:9px; }
    .choice { width:100%; display:grid; grid-template-columns:38px 1fr; text-align:left; align-items:start; gap:10px; min-height:54px; border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--text); padding:10px 12px; line-height:1.4; }
    .choice:hover { border-color:var(--accent); }
    .choice.selected { border-color:var(--accent); background:var(--accent-soft); }
    .choice.correct { border-color:var(--good); background:var(--good-soft); }
    .choice.wrong { border-color:var(--bad); background:var(--bad-soft); }
    .choice-letter { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--surface-2); font-weight:900; }
    .hint, .feedback { border-radius:12px; padding:12px 14px; margin-top:12px; line-height:1.5; }
    .hint { background:var(--warn-soft); color:var(--text); border-left:4px solid var(--warn); }
    .feedback.good { background:var(--good-soft); border-left:4px solid var(--good); }
    .feedback.bad { background:var(--bad-soft); border-left:4px solid var(--bad); }
    .question-actions { display:flex; flex-wrap:wrap; justify-content:space-between; gap:9px; margin-top:16px; }
    .left-actions, .right-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .flag-active { color:var(--warn)!important; border-color:var(--warn)!important; background:var(--warn-soft)!important; }
    .exam-sticky { position:sticky; top:74px; z-index:15; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; }
    .timer { font-variant-numeric:tabular-nums; font-size:1.2rem; font-weight:900; color:var(--accent-2); }
    .timer.low { color:var(--bad); }
    .exam-grid { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:14px; align-items:start; }
    .navigator { position:sticky; top:146px; max-height:calc(100vh - 166px); overflow:auto; }
    .nav-legend { display:flex; flex-wrap:wrap; gap:7px; color:var(--muted); font-size:.72rem; margin-bottom:10px; }
    .nav-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
    .qnav { aspect-ratio:1; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:8px; font-size:.72rem; font-weight:800; }
    .qnav.answered { background:var(--accent-soft); border-color:var(--accent); }
    .qnav.flagged { box-shadow:inset 0 -3px var(--warn); }
    .qnav.current { background:var(--accent); color:#fff; border-color:var(--accent); }
    .review-list { display:grid; gap:10px; margin-top:14px; }
    .review-item { border:1px solid var(--line); border-radius:13px; padding:14px; line-height:1.48; }
    .review-item.correct { border-left:5px solid var(--good); }
    .review-item.wrong { border-left:5px solid var(--bad); }
    footer { color:var(--muted); font-size:.75rem; text-align:center; padding:24px 8px 0; line-height:1.5; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width: 800px) {
      .performance-grid { grid-template-columns:1fr; }
      .exam-grid { grid-template-columns:1fr; }
      .navigator { position:static; max-height:none; }
      .nav-grid { grid-template-columns:repeat(10,1fr); }
    }
    @media (max-width: 640px) {
      .shell { padding:14px 10px calc(82px + env(safe-area-inset-bottom)); }
      .app-header { padding:2px 3px; }
      .theme-label { display:none; }
      .main-tabs { top:5px; gap:4px; padding:5px; }
      .tab-btn { font-size:.82rem; padding:7px 4px; }
      .card { padding:15px; border-radius:15px; }
      .toolbar { grid-template-columns:1fr; }
      .overview { grid-template-columns:1fr; justify-items:center; text-align:center; }
      .overview-stats { width:100%; }
      .study-body { padding:0 14px 15px; }
      .study-item summary { grid-template-columns:auto 1fr auto; padding:11px 13px; }
      .exam-sticky { top:67px; align-items:flex-start; }
      .exam-sticky .start-actions { margin:0; justify-content:flex-end; }
      .nav-grid { grid-template-columns:repeat(8,1fr); }
      .question-actions, .question-toolbar { align-items:stretch; }
      .question-actions .btn { flex:1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div><div class="eyebrow">BPOC 121</div><h1>Midterm Study App</h1><p class="subtitle">Study the lesson bank, target weak categories, practice with hints, and take a full 200-question exam.</p></div>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle dark mode"><span id="themeIcon">☾</span> <span class="theme-label">Theme</span></button>
    </header>
    <nav class="main-tabs" aria-label="Main sections">
      <button class="tab-btn active" data-tab="study" type="button">Study</button>
      <button class="tab-btn" data-tab="quiz" type="button">Quiz</button>
      <button class="tab-btn" data-tab="exam" type="button">Test Exam</button>
    </nav>
    <main>
      <section id="studyPanel" class="panel active" aria-labelledby="study-title">
        <div class="subtabs" role="tablist" aria-label="Study views">

          <button class="subtab" data-study-tab="performance" type="button">Performance</button>
        </div>
        <div id="studyContent"></div>
      </section>
      <section id="quizPanel" class="panel" aria-live="polite"><div id="quizContent"></div></section>
      <section id="examPanel" class="panel" aria-live="polite"><div id="examContent"></div></section>
    </main>
    <footer>Built from the supplied BPOC 121 study guide and lesson materials. Use this as a study aid and confirm current law, policy, and instructor guidance when they differ.</footer>
  </div>

  const $$ = (s, root=document) => [...root.querySelectorAll(s)];
  const byId = id => MIDTERM_QUESTION_BANK.find(q => q.id === Number(id));
  const studyById = id => MIDTERM_STUDY_BANK.find(x => x.id === Number(id));
  const categories = [...new Set(MIDTERM_QUESTION_BANK.map(q => q.category))].sort((a,b)=>a.localeCompare(b));
  const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const shuffle = items => { const a=[...items]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  const clamp = (n,min,max) => Math.max(min,Math.min(max,n));

  const defaultState = () => ({
    version: 1, bankRevision: QUESTION_BANK_REVISION, theme: null, activeTab: 'study', studyTab: 'material', flags: [],
    stats: {}, quiz: null, exam: null
  });
  function loadState(){
    try {
      const saved=JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if(saved.bankRevision!==QUESTION_BANK_REVISION) return {...defaultState(),theme:saved.theme||null,activeTab:saved.activeTab||'study',studyTab:saved.studyTab||'material',stats:saved.stats||{}};
      return {...defaultState(), ...saved};
    }
    catch { return defaultState(); }
  }
  let state = loadState();
  let examTicker = null;
  let studyUi = {query:'', category:'all', sort:'order', view:'material'};
  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function applyTheme(theme){
    const chosen = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = chosen;
    $('#themeIcon').textContent = chosen === 'dark' ? '☀' : '☾';
    document.querySelector('meta[name="theme-color"]').content = chosen === 'dark' ? '#121e1c' : '#0f766e';
  }
  applyTheme(state.theme);
  $('#themeToggle').addEventListener('click',()=>{ state.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'; applyTheme(state.theme); saveState(); });

  function selectMainTab(tab, opts={}){
    if(state.exam?.status==='active' && state.activeTab==='exam' && tab!=='exam') pauseExam(false);
    state.activeTab=tab; saveState();
    $$('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    $$('.panel').forEach(p=>p.classList.toggle('active',p.id===tab+'Panel'));
    if(tab==='study') renderStudy();
    if(tab==='quiz') renderQuiz();
    if(tab==='exam') renderExam();
    if(!opts.keepScroll) window.scrollTo({top:0,behavior:'smooth'});
  }
  $$('.tab-btn').forEach(b=>b.addEventListener('click',()=>selectMainTab(b.dataset.tab)));
  $$('.subtab').forEach(b=>b.addEventListener('click',()=>{ state.studyTab=b.dataset.studyTab; saveState(); renderStudy(); }));

  function renderStudy(){
    $$('.subtab').forEach(b=>b.classList.toggle('active',b.dataset.studyTab===state.studyTab));
    state.studyTab==='performance' ? renderPerformance() : renderStudyMaterial();
  }
  function renderStudyMaterial(){
    const content=$('#studyContent');
    content.innerHTML=`<div class="card"><div class="section-head"><div><h2 id="study-title">Study Material</h2><p>Expand any topic for its explanation and study focus, or review questions you flagged in Quiz or Test Exam.</p></div><span class="pill">${MIDTERM_STUDY_BANK.length} topics</span></div>
      <div class="toolbar"><label><span class="sr-only">Search</span><input id="studySearch" class="control" type="search" placeholder="Search topics or explanations…" value="${esc(studyUi.query)}"></label>
      <label><span class="sr-only">Category</span><select id="studyCategory" class="control"><option value="all">All categories</option>${[...new Set(MIDTERM_STUDY_BANK.map(x=>x.category))].sort().map(c=>`<option ${studyUi.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label><span class="sr-only">Sort or view</span><select id="studySort" class="control"><option value="order" ${studyUi.sort==='order'?'selected':''}>Guide order</option><option value="category" ${studyUi.sort==='category'?'selected':''}>Sort by category</option><option value="alpha" ${studyUi.sort==='alpha'?'selected':''}>A–Z by topic</option><option value="flagged" ${studyUi.sort==='flagged'?'selected':''}>Flagged questions</option></select></label></div>
      <div id="studyResults"></div></div>`;
    $('#studySearch').addEventListener('input',e=>{studyUi.query=e.target.value;renderStudyResults();});
    $('#studyCategory').addEventListener('change',e=>{studyUi.category=e.target.value;renderStudyResults();});
    $('#studySort').addEventListener('change',e=>{studyUi.sort=e.target.value;renderStudyResults();});
    renderStudyResults();
  }
  function renderStudyResults(){
    const root=$('#studyResults'); if(!root)return;
    const term=studyUi.query.trim().toLowerCase();
    if(studyUi.sort==='flagged'){
      let qs=state.flags.map(byId).filter(Boolean).filter(q=>!term || [q.question,q.explanation,q.category,q.code].join(' ').toLowerCase().includes(term));
      if(studyUi.category!=='all'){
        const itemIds=new Set(MIDTERM_STUDY_BANK.filter(x=>x.category===studyUi.category).map(x=>x.id)); qs=qs.filter(q=>itemIds.has(q.studyItemId));
      }
      root.innerHTML=`<div class="results-line">${qs.length} flagged question${qs.length===1?'':'s'}</div><div class="review-list">${qs.map(flaggedCard).join('') || '<div class="empty">No flagged questions match these filters. Flag questions in Quiz or Test Exam to collect them here.</div>'}</div>`;
      $$('.unflag-study',root).forEach(b=>b.addEventListener('click',()=>{toggleFlag(Number(b.dataset.id));renderStudyResults();})); return;
    }
    let items=MIDTERM_STUDY_BANK.filter(x=>(studyUi.category==='all'||x.category===studyUi.category) && (!term || [x.topic,x.explanation,x.studyFocus,x.category,...x.sources].join(' ').toLowerCase().includes(term)));
    if(studyUi.sort==='category') items.sort((a,b)=>a.category.localeCompare(b.category)||a.id-b.id);
    if(studyUi.sort==='alpha') items.sort((a,b)=>a.topic.localeCompare(b.topic));
    root.innerHTML=`<div class="results-line">Showing ${items.length} of ${MIDTERM_STUDY_BANK.length} topics</div><div class="study-list">${items.map(studyCard).join('') || '<div class="empty">No study topics match your filters.</div>'}</div>`;
  }
  function studyCard(x){return `<details class="study-item"><summary><span class="item-num">${x.id}</span><span><span class="item-title">${esc(x.topic)}</span><span class="tags"><span class="tag">${esc(x.category)}</span></span></span><span class="chevron">⌄</span></summary><div class="study-body"><p>${esc(x.explanation)}</p><div class="focus-box"><strong>Study focus:</strong> ${esc(x.studyFocus)}</div><div class="tags"><span class="tag">${esc(x.sourceBasis)}</span>${x.sources.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div></details>`;}
  function flaggedCard(q){return `<article class="review-item"><div class="category-top"><div><span class="question-code">${esc(q.code||q.category)}</span><h3>${esc(q.question)}</h3></div><button class="btn secondary small unflag-study" data-id="${q.id}" type="button">★ Unflag</button></div><p><strong>Answer: ${esc(q.correctAnswer)}.</strong> ${esc(q.choices[q.correctIndex].text)}</p><p>${esc(q.explanation)}</p><div class="tags"><span class="tag">${esc(q.category)}</span><span class="tag">Study item ${q.studyItemId}</span></div></article>`;}

  function statFor(cat){return state.stats[cat] || {attempted:0,correct:0};}
  function renderPerformance(){
    const totals=categories.reduce((a,c)=>{const s=statFor(c);a.attempted+=s.attempted;a.correct+=s.correct;return a;},{attempted:0,correct:0});
    const pct=totals.attempted?Math.round(totals.correct/totals.attempted*100):0;
    $('#studyContent').innerHTML=`<div class="card"><div class="section-head"><div><h2>Performance by Category</h2><p>Results update after checked quiz answers and submitted test exams.</p></div><span class="pill">${categories.length} categories</span></div>
      <div class="overview"><div class="donut" style="--score:${pct}%"><strong>${pct}%</strong></div><div class="overview-stats"><div class="stat"><strong>${totals.attempted}</strong><span>Answered</span></div><div class="stat"><strong>${totals.correct}</strong><span>Correct</span></div><div class="stat"><strong>${state.flags.length}</strong><span>Flagged</span></div></div></div>
      <div class="performance-grid">${categories.map(c=>{const s=statFor(c),p=s.attempted?Math.round(s.correct/s.attempted*100):0,n=MIDTERM_QUESTION_BANK.filter(q=>q.category===c).length;return `<article class="category-card"><div class="category-top"><h3>${esc(c)}</h3><strong>${p}%</strong></div><div class="bar"><span style="width:${p}%"></span></div><div class="category-meta"><span>${s.correct}/${s.attempted} correct · ${n} available</span><button class="btn small category-quiz" data-category="${esc(c)}" type="button">Quiz section</button></div></article>`;}).join('')}</div></div>`;
    $$('.category-quiz').forEach(b=>b.addEventListener('click',()=>startQuiz(b.dataset.category)));
  }

  function startQuiz(category=null){
    const pool=category?MIDTERM_QUESTION_BANK.filter(q=>q.category===category):MIDTERM_QUESTION_BANK;
    const count=Math.min(category?15:20,pool.length);
    state.quiz={category:category||null, ids:shuffle(pool).slice(0,count).map(q=>q.id), index:0, selected:null, revealed:false, hint:false, correct:0, completed:false};
    saveState(); selectMainTab('quiz');
  }
  function renderQuiz(){
    const root=$('#quizContent'), z=state.quiz;
    if(!z){root.innerHTML=`<div class="card start-card"><span class="pill">558-question bank</span><h2>Randomized Quiz</h2><p>Start a 20-question mixed quiz pulled from the entire bank. You will receive immediate feedback, may reveal a hint, and can flag questions for later study.</p><div class="start-actions"><button id="startMixed" class="btn" type="button">Start mixed quiz</button></div></div>`;$('#startMixed').onclick=()=>startQuiz();return;}
    if(z.completed){
      const pct=Math.round(z.correct/z.ids.length*100); root.innerHTML=`<div class="card start-card"><span class="pill">Quiz complete</span><h2>${z.correct} of ${z.ids.length} correct</h2><div class="donut" style="--score:${pct}%;margin:18px auto"><strong>${pct}%</strong></div><p>${z.category?`Section: ${esc(z.category)}`:'Mixed categories'}. Your category performance has been updated.</p><div class="start-actions"><button id="againQuiz" class="btn" type="button">Try another</button><button id="studyPerf" class="btn secondary" type="button">View performance</button></div></div>`;
      $('#againQuiz').onclick=()=>startQuiz(z.category); $('#studyPerf').onclick=()=>{state.studyTab='performance';selectMainTab('study');}; return;
    }
    const q=byId(z.ids[z.index]), selected=z.selected;
    root.innerHTML=`<div class="question-wrap"><div class="card"><div class="question-toolbar"><span class="pill">${z.category?esc(z.category):'Mixed quiz'}</span><strong>${z.index+1} / ${z.ids.length} · Score ${z.correct}</strong></div><div class="progress"><span style="width:${(z.index+1)/z.ids.length*100}%"></span></div><div class="question-code">${esc(q.code||q.category)} · ${esc(q.difficulty)}</div><div class="question-text">${esc(q.question)}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice ${selected===i?'selected':''} ${z.revealed&&i===q.correctIndex?'correct':''} ${z.revealed&&selected===i&&i!==q.correctIndex?'wrong':''}" data-choice="${i}" type="button" ${z.revealed?'disabled':''}><span class="choice-letter">${c.label}</span><span>${esc(c.text)}</span></button>`).join('')}</div>${z.hint&&!z.revealed?`<div class="hint"><strong>Hint:</strong> ${esc(q.hint)}</div>`:''}${z.revealed?`<div class="feedback ${selected===q.correctIndex?'good':'bad'}"><strong>${selected===q.correctIndex?'Correct.':'Not quite.'}</strong> ${esc(q.explanation)}</div>`:''}<div class="question-actions"><div class="left-actions"><button id="quizHint" class="btn secondary" type="button" ${z.revealed?'disabled':''}>${z.hint?'Hint shown':'Show hint'}</button><button id="quizFlag" class="btn secondary ${isFlagged(q.id)?'flag-active':''}" type="button">${isFlagged(q.id)?'★ Flagged':'☆ Flag'}</button></div><div class="right-actions">${z.revealed?`<button id="quizNext" class="btn" type="button">${z.index===z.ids.length-1?'Finish quiz':'Next question'}</button>`:`<button id="quizCheck" class="btn" type="button" ${selected===null?'disabled':''}>Check answer</button>`}</div></div></div></div>`;
    $$('.choice').forEach(b=>b.onclick=()=>{z.selected=Number(b.dataset.choice);saveState();renderQuiz();});
    $('#quizHint').onclick=()=>{z.hint=true;saveState();renderQuiz();};
    $('#quizFlag').onclick=()=>{toggleFlag(q.id);renderQuiz();};
    if(!z.revealed) $('#quizCheck').onclick=()=>{z.revealed=true;if(z.selected===q.correctIndex)z.correct++;recordStat(q.category,z.selected===q.correctIndex);saveState();renderQuiz();};
    else $('#quizNext').onclick=()=>{if(z.index===z.ids.length-1)z.completed=true;else{z.index++;z.selected=null;z.revealed=false;z.hint=false;}saveState();renderQuiz();};
  }
  function recordStat(cat,correct){const s=statFor(cat);state.stats[cat]={attempted:s.attempted+1,correct:s.correct+(correct?1:0)};}
  function isFlagged(id){return state.flags.includes(Number(id));}
  function toggleFlag(id){id=Number(id);state.flags=isFlagged(id)?state.flags.filter(x=>x!==id):[...state.flags,id];saveState();}

  function makeBalancedExam(count){
    const pools=new Map(categories.map(c=>[c,shuffle(MIDTERM_QUESTION_BANK.filter(q=>q.category===c))])); const out=[];
    while(out.length<count){let added=0;for(const c of shuffle(categories)){const pool=pools.get(c);if(pool.length&&out.length<count){out.push(pool.pop().id);added++;}}if(!added)break;}
    return out;
  }
  function startExam(){
    if(!confirm('Start a new 200-question, two-hour exam? Hints and feedback are disabled until submission.'))return;
    state.exam={status:'active',ids:makeBalancedExam(200),answers:{},flags:[],index:0,remaining:EXAM_SECONDS,anchor:Date.now(),result:null};saveState();startTicker();renderExam();
  }
  function remainingSeconds(){const e=state.exam;if(!e)return EXAM_SECONDS;return e.status==='active'?Math.max(0,e.remaining-Math.floor((Date.now()-e.anchor)/1000)):e.remaining;}
  function startTicker(){clearInterval(examTicker);if(state.exam?.status==='active')examTicker=setInterval(()=>{const left=remainingSeconds();const el=$('#examTimer');if(el){el.textContent=formatTime(left);el.classList.toggle('low',left<=600);}if(left<=0)submitExam(true);},1000);}
  function formatTime(s){s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':');}
  function pauseExam(show=true){
    if(state.exam?.status!=='active')return;state.exam.remaining=remainingSeconds();state.exam.anchor=null;state.exam.status='paused';clearInterval(examTicker);saveState();if(show)renderExam();
  }
  function resumeExam(){if(state.exam?.status!=='paused')return;state.exam.status='active';state.exam.anchor=Date.now();saveState();startTicker();renderExam();}
  function forfeitExam(){if(!state.exam||!confirm('Forfeit this exam and erase its saved answers? This cannot be undone.'))return;state.exam=null;clearInterval(examTicker);saveState();renderExam();}
  function submitExam(auto=false){
    const e=state.exam;if(!e||e.status==='completed')return;const unanswered=e.ids.length-Object.keys(e.answers).length;
    if(!auto&&!confirm(unanswered?`Submit now with ${unanswered} unanswered question${unanswered===1?'':'s'}?`:'Submit this exam for scoring?'))return;
    if(e.status==='active')e.remaining=remainingSeconds();clearInterval(examTicker);
    let correct=0;const categoryResults={};
    e.ids.forEach(id=>{const q=byId(id),ok=Number(e.answers[id])===q.correctIndex;correct+=ok?1:0;const s=categoryResults[q.category]||{attempted:0,correct:0};s.attempted++;s.correct+=ok?1:0;categoryResults[q.category]=s;recordStat(q.category,ok);});
    e.status='completed';e.anchor=null;e.result={correct,submittedAt:Date.now(),categoryResults,auto};saveState();renderExam();
  }
  function renderExam(){
    const root=$('#examContent'),e=state.exam;
    if(!e){root.innerHTML=`<div class="card start-card"><span class="pill">Full practice exam</span><h2>200 questions · 2 hours</h2><p>Questions are selected without duplicates and distributed as evenly as possible across every available category. Answers are saved locally. There are no hints or immediate results.</p><div class="start-actions"><button id="startExam" class="btn" type="button">Start test exam</button></div></div>`;$('#startExam').onclick=startExam;return;}
    if(e.status==='completed'){renderExamResults();return;}
    if(e.status==='paused'){
      const answered=Object.keys(e.answers).length;root.innerHTML=`<div class="card start-card"><span class="pill">Exam paused and saved</span><h2>${answered} of ${e.ids.length} answered</h2><p>Your current question, answers, flags, and remaining time (${formatTime(e.remaining)}) are saved on this device.</p><div class="start-actions"><button id="resumeExam" class="btn" type="button">Resume exam</button><button id="forfeitPaused" class="btn danger" type="button">Forfeit exam</button></div></div>`;$('#resumeExam').onclick=resumeExam;$('#forfeitPaused').onclick=forfeitExam;return;
    }
    startTicker(); const q=byId(e.ids[e.index]),ans=e.answers[q.id];
    root.innerHTML=`<div class="card exam-sticky"><div><div class="eyebrow">Question ${e.index+1} of ${e.ids.length}</div><div id="examTimer" class="timer ${remainingSeconds()<=600?'low':''}">${formatTime(remainingSeconds())}</div></div><div class="start-actions"><button id="pauseExam" class="btn secondary small" type="button">Pause & Save</button><button id="forfeitExam" class="btn danger small" type="button">Forfeit</button></div></div><div class="exam-grid"><div class="card"><div class="question-code">${esc(q.code||q.category)} · ${esc(q.category)}</div><div class="question-text">${esc(q.question)}</div><div class="choices">${q.choices.map((c,i)=>`<button class="choice ${Number(ans)===i?'selected':''}" data-exam-choice="${i}" type="button"><span class="choice-letter">${c.label}</span><span>${esc(c.text)}</span></button>`).join('')}</div><div class="question-actions"><div class="left-actions"><button id="examFlag" class="btn secondary ${e.flags.includes(q.id)?'flag-active':''}" type="button">${e.flags.includes(q.id)?'★ Flagged':'☆ Flag'}</button></div><div class="right-actions"><button id="examPrev" class="btn secondary" type="button" ${e.index===0?'disabled':''}>Previous</button><button id="examNext" class="btn" type="button">${e.index===e.ids.length-1?'Review & submit':'Next'}</button></div></div></div><aside class="card navigator"><div class="section-head"><div><h3>Navigator</h3><p>${Object.keys(e.answers).length} answered · ${e.flags.length} flagged</p></div></div><div class="nav-legend"><span>Filled = answered</span><span>Underline = flagged</span></div><div class="nav-grid">${e.ids.map((id,i)=>`<button class="qnav ${e.answers[id]!==undefined?'answered':''} ${e.flags.includes(id)?'flagged':''} ${i===e.index?'current':''}" data-go="${i}" type="button">${i+1}</button>`).join('')}</div><button id="submitExam" class="btn" style="width:100%;margin-top:12px" type="button">Submit exam</button></aside></div>`;
    $$('[data-exam-choice]').forEach(b=>b.onclick=()=>{e.answers[q.id]=Number(b.dataset.examChoice);saveState();renderExam();});
    $$('[data-go]').forEach(b=>b.onclick=()=>{e.index=Number(b.dataset.go);saveState();renderExam();window.scrollTo({top:0,behavior:'smooth'});});
    $('#pauseExam').onclick=()=>pauseExam(true);$('#forfeitExam').onclick=forfeitExam;$('#submitExam').onclick=()=>submitExam(false);
    $('#examFlag').onclick=()=>{const nowFlagged=!e.flags.includes(q.id);e.flags=nowFlagged?[...e.flags,q.id]:e.flags.filter(x=>x!==q.id);state.flags=nowFlagged?(isFlagged(q.id)?state.flags:[...state.flags,q.id]):state.flags.filter(x=>x!==q.id);saveState();renderExam();};
    $('#examPrev').onclick=()=>{if(e.index>0)e.index--;saveState();renderExam();};
    $('#examNext').onclick=()=>{if(e.index<e.ids.length-1){e.index++;saveState();renderExam();window.scrollTo({top:0,behavior:'smooth'});}else submitExam(false);};
  }
  function renderExamResults(){
    const e=state.exam,r=e.result,pct=Math.round(r.correct/e.ids.length*100),missed=e.ids.filter(id=>Number(e.answers[id])!==byId(id).correctIndex);
    const cats=Object.entries(r.categoryResults).sort((a,b)=>a[0].localeCompare(b[0]));
    $('#examContent').innerHTML=`<div class="card"><div class="section-head"><div><span class="pill">Exam complete</span><h2>${r.correct} of ${e.ids.length} correct · ${pct}%</h2><p>${r.auto?'Time expired and the exam was submitted automatically.':'Your category performance has been updated.'}</p></div><button id="clearExam" class="btn secondary" type="button">Start over</button></div><div class="overview"><div class="donut" style="--score:${pct}%"><strong>${pct}%</strong></div><div class="performance-grid">${cats.map(([c,s])=>{const p=Math.round(s.correct/s.attempted*100);return `<div class="category-card"><div class="category-top"><h3>${esc(c)}</h3><strong>${p}%</strong></div><div class="bar"><span style="width:${p}%"></span></div><div class="category-meta"><span>${s.correct}/${s.attempted} correct</span></div></div>`;}).join('')}</div></div><h3>Review missed questions (${missed.length})</h3><div class="review-list">${missed.map(id=>{const q=byId(id),chosen=e.answers[id];return `<article class="review-item wrong"><div class="question-code">${esc(q.code||q.category)}</div><strong>${esc(q.question)}</strong><p>Your answer: ${chosen===undefined?'Unanswered':esc(q.choices[chosen].label+'. '+q.choices[chosen].text)}</p><p><strong>Correct: ${esc(q.correctAnswer)}. ${esc(q.choices[q.correctIndex].text)}</strong></p><p>${esc(q.explanation)}</p></article>`;}).join('')||'<div class="empty">Perfect score—there are no missed questions to review.</div>'}</div></div>`;
    $('#clearExam').onclick=()=>{state.exam=null;saveState();renderExam();};
  }

  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.exam?.status==='active')pauseExam(false);});
  window.addEventListener('beforeunload',()=>{if(state.exam?.status==='active'){state.exam.remaining=remainingSeconds();state.exam.anchor=null;state.exam.status='paused';saveState();}});
  selectMainTab(state.activeTab||'study',{keepScroll:true});
  </script>
</body>
</html>
